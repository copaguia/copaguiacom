
<swiper-container effect="cards" grab-cursor="true" autoplay-delay="2500" autoplay-disable-on-interaction="false">
  
  @for (item of conector; track $index) {
    <swiper-slide>
      
      <div class="slide-layout">
        <!-- Imagen flotante dentro de una tarjeta Material con margen -->
        <mat-card class="image-card" appearance="outlined">
          <img src="https://i.imgur.com/S5BUqP5.jpeg" alt="Publicidad">
        </mat-card>
        
        <!-- Toolbar inferior separado de la imagen -->
        <div class="actions-toolbar">
          <button matButton="filled">WHATSAPP</button>
          <button matButton>IR AL PERFIL</button>
          <button matButton="filled">LLAMAR</button>
        </div>
      </div>
      
    
      

     </swiper-slide> 
 } 

</swiper-container>
