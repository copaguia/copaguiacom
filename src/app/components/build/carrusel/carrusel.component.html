<div class="material-carousel" #carouselContainer>
  @for (item of conector; track $index) {
    <div class="carousel-item">
      <mat-card class="example-card" appearance="outlined">
        
        <mat-card-header>
          <div mat-card-avatar class="default-avatar">
            <mat-icon>storefront</mat-icon>
          </div>
          <mat-card-title>{{ item.patrocinador || 'Anunciante' }}</mat-card-title>
          <mat-card-subtitle>Publicidad</mat-card-subtitle>
        </mat-card-header>
        
        @if (item.image) {
          <img mat-card-image [src]="item.image" alt="Publicidad">
        } @else {
          <div class="empty-banner-placeholder">
            <mat-icon class="placeholder-icon">campaign</mat-icon>
            <span class="placeholder-title">Publicidad Disponible</span>
            <span class="placeholder-subtitle">Tamaño recomendado:<br>1080x1350px (4:5)</span>
            
            <button mat-stroked-button color="accent" class="interest-btn" (click)="openInterestDialog($index)">
              ¡Me interesa este espacio!
            </button>
          </div>
        }

        <!-- Botonera estándar de Material -->
        <mat-card-actions class="actions-toolbar">
          <button matButton="filled" [disabled]="!item.image">WHATSAPP</button>
          <button matButton [disabled]="!item.image">PERFIL</button>
          <button matButton="filled" [disabled]="!item.image">LLAMAR</button>
        </mat-card-actions>
        
      </mat-card>
    </div>
  }
</div>
