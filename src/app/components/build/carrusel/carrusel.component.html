<div class="material-carousel" #carouselContainer>
  @for (item of conector; track $index) {
    <div class="carousel-item">
      <mat-card class="example-card" appearance="outlined">
        
        <mat-card-header>
          <div mat-card-avatar class="example-header-image"></div>
          <mat-card-title>Shiba Inu</mat-card-title>
          <mat-card-subtitle>Dog Breed</mat-card-subtitle>
        </mat-card-header>
        
        <img mat-card-image src="https://i.imgur.com/S5BUqP5.jpeg" alt="Publicidad">
        
        <mat-card-content>
          <!-- Puedes agregar texto aquí -->
        </mat-card-content>

        <!-- Botonera estándar de Material -->
        <mat-card-actions class="actions-toolbar">
          <button matButton="filled">WHATSAPP</button>
          <button matButton>PERFIL</button>
          <button matButton="filled">LLAMAR</button>
        </mat-card-actions>
        
      </mat-card>
    </div>
  }
</div>
