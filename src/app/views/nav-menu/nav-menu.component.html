<mat-sidenav-container class="sidenav-container">

  <mat-sidenav #drawer class="sidenav" fixedInViewport [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'" [opened]="(isHandset$ | async) === false">
    <mat-toolbar>Negocios</mat-toolbar>
    <mat-nav-list>
      @for (item of categorias(); track $index) {
      <a mat-list-item routerLink="{{ item.ruta }}" class="nav-item">
        <span class="nav-label">{{ item.ruta }}</span>
        @if (categoriasConPromo().has(item.ruta) && !publicidadService.promosVistasLocalmente().has(item.ruta)) {
          <span class="promo-dot" aria-label="Promoción activa"></span>
        }
      </a>
      }

    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="container">
    <mat-toolbar color="primary">
      @if (isHandset$ | async) {
      <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span>Copaguia</span> }
    </mat-toolbar>
    <!-- Add Content Here -->

    <router-outlet />
  </mat-sidenav-content>

</mat-sidenav-container>
